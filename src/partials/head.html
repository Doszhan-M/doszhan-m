<style>
  #p_prldr{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:30}
  #p_prldr .pl_box{height:280px;width:280px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#06140a;border-radius:100%;overflow:hidden}
  #p_prldr .pl_percent{position:absolute;left:0;top:0;z-index:3;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font:64px/1 Arial,Helvetica,sans-serif}
  #p_prldr .pl_percent_sign{font-size:32px;margin-left:4px}
  #p_prldr .pl_water{position:absolute;left:0;top:0;z-index:2;width:100%;height:100%;transform:translate(0,100%);background:#13be3e;transition:transform .3s}
  #p_prldr .pl_wave{width:200%;position:absolute;bottom:100%}
  #p_prldr .pl_wave_back{right:0;fill:#8ff0a8;animation:pl-wave-back 1.4s infinite linear}
  #p_prldr .pl_wave_front{left:0;fill:#13be3e;margin-bottom:-1px;animation:pl-wave-front .7s infinite linear}
  @keyframes pl-wave-front{100%{transform:translate(-50%,0)}}
  @keyframes pl-wave-back{100%{transform:translate(50%,0)}}
</style>
